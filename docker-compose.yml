services:
  database:
    image: postgres:17-alpine
    container_name: inface-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DATABASE:-inface_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DATABASE:-inface_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inface-network

  backend:
    build: ./backend
    container_name: inface-backend
    environment:
      # 5432 puerto de la bd
      - DATABASE_URL=postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres123}@database:5432/${DATABASE:-inface_db}
      - PORT=${PORT}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    ports:
      # cambiar los puertos (80 interno, 8086 externo)
      - "8086:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - inface-network

  frontend:
    build:
      context: ./frontend
      args:
        # el navegador del usuario llega al backend por su propio puerto público
        VITE_API_URL: ${VITE_API_URL}
    container_name: inface-frontend
    ports:
      # cambiar los puertos (443 interno, 8449 externo)
      - "8449:443"
    depends_on:
      - backend
    networks:
      - inface-network

networks:
  inface-network:
    driver: bridge

volumes:
  postgres_data: