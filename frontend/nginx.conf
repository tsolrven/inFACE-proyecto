server {
    listen 443;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cualquier ruta que no sea un archivo real (ej. /perfil, /match-proyectos)
    # se resuelve devolviendo index.html, para que React Router la maneje
    location / {
        try_files $uri $uri/ /index.html;
    }

    # los archivos con hash en el nombre (los que genera Vite) se pueden
    # cachear agresivamente sin riesgo, porque cambian de nombre si cambia el contenido
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
